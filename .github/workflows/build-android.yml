name: Build Android

on:
  push:
    branches:
      - main
      - master
      - claude/autocarnet-specs-mj7872
  pull_request:
    branches:
      - main
      - master
      - claude/autocarnet-specs-mj7872
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build the Play Store App Bundle (leave unchecked for an APK-only test build)"
        type: boolean
        default: true

jobs:
  build:
    name: Analyze, test and build APK / AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate database code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret - release build cannot be signed. Configure the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets before running this workflow."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/autocarnet-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=autocarnet-release.jks
          EOF

      - name: Build release APK (split per ABI - smaller downloads for testing)
        run: flutter build apk --release --split-per-abi

      # Skipped only for a manual workflow_dispatch run with build_aab
      # unchecked - every push/pull_request build still produces both, same
      # as before. The AAB is the Play Store submission artifact; it should
      # only be produced once a TEST APK build has actually been validated
      # end-to-end on a real device.
      - name: Build release App Bundle (Play Store)
        if: github.event_name != 'workflow_dispatch' || inputs.build_aab
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/autocarnet-release-arm64-v8a.apk

      - name: Upload APK (arm64-v8a - covers virtually all modern phones)
        uses: actions/upload-artifact@v4
        with:
          name: autocarnet-apk
          path: dist/autocarnet-release-arm64-v8a.apk
          retention-days: 30

      - name: Rename App Bundle artifact
        if: github.event_name != 'workflow_dispatch' || inputs.build_aab
        run: cp build/app/outputs/bundle/release/app-release.aab dist/autocarnet-release.aab

      - name: Upload App Bundle
        if: github.event_name != 'workflow_dispatch' || inputs.build_aab
        uses: actions/upload-artifact@v4
        with:
          name: autocarnet-aab
          path: dist/autocarnet-release.aab
          retention-days: 30
